
# ==========================================
# BANCO DE DADOS H2
# ==========================================

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==========================================
# PAGINAÇÃO
# ==========================================

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100


# ==========================================
# SWAGGER
# ==========================================

springdoc.swagger-ui.custom-css-path=/swagger-custom.css
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ==========================================
# RATE LIMITING
# ==========================================

biblioteca.rate-limit.capacidade=30
biblioteca.rate-limit.periodo-segundos=60


# ==========================================
# IDEMPOTÊNCIA
# ==========================================

biblioteca.idempotency.ttl-horas=24


# ==========================================
# CORS
# ==========================================

biblioteca.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081,https://biblioteca-app.vercel.app,https://biblioteca-front-gilt.vercel.app,https://biblioteca-front-*-jadiborgees-projects.vercel.app,https://biblioteca-da-comunidade.vercel.app


# ==========================================
# AUTENTICAÇÃO - ADMIN
# ==========================================

biblioteca.admin.email=${ADMIN_EMAIL}
biblioteca.admin.password=${ADMIN_PASSWORD}


# ==========================================
# AUTENTICAÇÃO - OPERADOR
# ==========================================

biblioteca.operador.email=${OPERADOR_EMAIL}
biblioteca.operador.password=${OPERADOR_PASSWORD}
