
# ==========================================
# PERFIL DE PRODUÇÃO - RENDER
# ==========================================

# Porta disponibilizada pelo Render
server.port=${PORT:8080}

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Desativa logs SQL em produção
spring.jpa.show-sql=false

# Paginação
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.custom-css-path=/swagger-custom.css

# Rate limiting
biblioteca.rate-limit.capacidade=60
biblioteca.rate-limit.periodo-segundos=60

# Idempotência
biblioteca.idempotency.ttl-horas=24

# Autenticação administrativa
biblioteca.admin.email=${ADMIN_EMAIL}
biblioteca.admin.password=${ADMIN_PASSWORD}
