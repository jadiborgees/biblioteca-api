<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Empréstimos - Painel Administrativo</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="sidebar-container"></div>

<main class="content">
    <div class="page-header">
        <h1>Gestão de Empréstimos</h1>
    </div>

    <div class="card">
        <h2>Registrar Novo Empréstimo</h2>
        <form id="form-emprestimo" style="margin-top: 1rem;">
            <div class="form-grid">
                <div class="form-group">
                    <label for="usuarioId">Usuário *</label>
                    <select id="usuarioId" class="form-control" required>
                        <option value="">Selecione um usuário</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="livroId">Livro *</label>
                    <select id="livroId" class="form-control" required>
                        <option value="">Selecione um livro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dataDevolucaoPrevista">Data Prevista de Devolução *</label>
                    <input type="date" id="dataDevolucaoPrevista" class="form-control" required>
                </div>
            </div>

            <div style="margin-top: 1rem; text-align: right;">
                <button type="submit" class="btn btn-primary">Confirmar Empréstimo</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Empréstimos Cadastrados</h2>
        <div class="table-container" style="margin-top: 1rem;">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuário</th>
                    <th>Livro</th>
                    <th>Data Empréstimo</th>
                    <th>Data Prevista</th>
                    <th>Data Devolução</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabela-emprestimos">
                <tr>
                    <td colspan="8" style="text-align: center;">Carregando empréstimos...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await carregarUsuarios();
        await carregarLivros();
        await carregarEmprestimos();

        document.getElementById('form-emprestimo').addEventListener('submit', async (e) => {
            e.preventDefault();
            await registrarEmprestimo();
        });
    });

    async function carregarUsuarios() {
        const select = document.getElementById('usuarioId');
        try {
            const data = await API.get('/usuarios');
            const usuarios = data._embedded ? data._embedded.usuarioList : [];
            select.innerHTML = '<option value="">Selecione um usuário</option>';
            usuarios.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id;
                opt.textContent = `${u.nome} (${u.email})`;
                select.appendChild(opt);
            });
        } catch (error) {
            console.error('Erro ao carregar usuários:', error);
        }
    }

    async function carregarLivros() {
        const select = document.getElementById('livroId');
        try {
            const data = await API.get('/livros');
            const livros = data._embedded ? data._embedded.livroList : [];
            select.innerHTML = '<option value="">Selecione um livro</option>';
            livros.forEach(l => {
                const qtd = l.quantidadeDisponivel !== undefined ? l.quantidadeDisponivel : (l.quantidade !== undefined ? l.quantidade : 0);
                const opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = `${l.titulo} (Disponível: ${qtd})`;
                if (qtd <= 0) opt.disabled = true;
                select.appendChild(opt);
            });
        } catch (error) {
            console.error('Erro ao carregar livros:', error);
        }
    }

    async function carregarEmprestimos() {
        const tbody = document.getElementById('tabela-emprestimos');
        try {
            const data = await API.get('/emprestimos');
            const emprestimos = data._embedded ? data._embedded.emprestimoList : [];

            if (emprestimos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Nenhum empréstimo encontrado.</td></tr>';
                return;
            }

            tbody.innerHTML = emprestimos.map(emp => {
                const dtEmp = emp.dataEmprestimo ? emp.dataEmprestimo.split('-').reverse().join('/') : '-';
                const dtPrev = emp.dataPrevistaDevolucao ? emp.dataPrevistaDevolucao.split('-').reverse().join('/') : '-';
                const dtDev = emp.dataDevolucao ? emp.dataDevolucao.split('-').reverse().join('/') : '-';

                let badgeClass = 'badge-ativo';
                if (emp.status === 'ATRASADO') badgeClass = 'badge-atrasado';
                if (emp.status === 'DEVOLVIDO') badgeClass = 'badge-devolvido';

                const botaoDevolver = emp.status !== 'DEVOLVIDO'
                    ? `<button onclick="devolverLivro(${emp.id})" class="btn btn-primary btn-sm">Devolver</button>`
                    : '-';

                return `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.usuario ? emp.usuario.nome : 'N/A'}</td>
                            <td>${emp.livro ? emp.livro.titulo : 'N/A'}</td>
                            <td>${dtEmp}</td>
                            <td>${dtPrev}</td>
                            <td>${dtDev}</td>
                            <td><span class="badge ${badgeClass}">${emp.status}</span></td>
                            <td>${botaoDevolver}</td>
                        </tr>
                    `;
            }).join('');
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--danger);">${error.message}</td></tr>`;
        }
    }

    async function registrarEmprestimo() {
        const hoje = new Date().toISOString().split('T')[0];

        const payload = {
            usuario: { id: parseInt(document.getElementById('usuarioId').value) },
            livro: { id: parseInt(document.getElementById('livroId').value) },
            dataEmprestimo: hoje,
            dataPrevistaDevolucao: document.getElementById('dataDevolucaoPrevista').value,
            status: 'ATIVO'
        };

        try {
            await API.post('/emprestimos', payload);
            alert('Empréstimo registrado com sucesso!');
            document.getElementById('form-emprestimo').reset();
            await carregarEmprestimos();
            await carregarLivros();
        } catch (error) {
            alert(`Erro ao registrar empréstimo:\n${error.message}`);
        }
    }

    async function devolverLivro(id) {
        if (!confirm(`Confirmar a devolução do empréstimo ID ${id}?`)) return;

        try {
            await API.patch(`/emprestimos/${id}/devolver`);
            alert('Livro devolvido com sucesso!');
            await carregarEmprestimos();
            await carregarLivros();
        } catch (error) {
            alert(`Erro ao realizar devolução:\n${error.message}`);
        }
    }
</script>
</body>
</html>
